name: CS:S v34 server tree
description: >-
  Restore server-art/css34-server.tar.gz from the Actions cache, or prepare it:
  fetch the CS:S v34 dedicated server, apply the Valve RC fix and the srcds
  BufferFix, keep only de_dust2, de_inferno and de_nuke. The cache key changes
  with any of the preparation scripts.
inputs:
  save:
    description: "'true': save a freshly prepared tree to the cache (ci.yml prepare-server)"
    required: false
    default: "false"
outputs:
  key:
    description: Cache key of the tree, for actions/cache/restore in later jobs
    value: ${{ steps.restore.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Restore cached server tree
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: server-art/css34-server.tar.gz
        key: css34-server-v1-1-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}

    - name: Prepare server tree (cache miss)
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        SERVER_DIR: ${{ github.workspace }}/.ci-server
        CACHE_DIR: ${{ github.workspace }}/.ci-cache
        APPLY_SRCDS_PATCH: "1"
        APPLY_VALVE_RC: "1"
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y curl unzip unrar
        testing/scripts/fetch-server.sh
        testing/scripts/apply-valve-rc-fix.sh
        testing/scripts/apply-srcds-patch.sh
        KEEP_MAPS=de_dust2,de_inferno,de_nuke testing/scripts/trim-server-maps.sh
        mkdir -p server-art
        tar -C "$SERVER_DIR" -czf server-art/css34-server.tar.gz .
        rm -rf "$SERVER_DIR"
        ls -lh server-art/css34-server.tar.gz

    - name: Save server tree cache
      if: inputs.save == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: server-art/css34-server.tar.gz
        key: ${{ steps.restore.outputs.cache-primary-key }}
