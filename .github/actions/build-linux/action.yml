name: Build Linux packages
description: >-
  Build a line's SourceMod + Metamod Linux packages in the pinned manylinux2014
  image (builder/docker/build.sh), then run the static package checks: ABI and
  exports (check-package.sh) and the line's MM 1.12 package with the bridge's
  metamod.1.ep1 legacy core (verify-line-metamod-packages.sh). Used by ci.yml
  and release.yml.
inputs:
  line:
    description: CSS34_LINE to build (an active line of builder/lines.json)
    required: true
  deps-cache:
    description: >-
      'true' restores and saves the built dependency prefixes (zlib, OpenSSL,
      MariaDB Connector/C, MySQL SDK; builder/deps_cache.py paths) with
      actions/cache. ci.yml only: release.yml leaves it unset and always builds
      them from scratch. The builder reuses a restored prefix only when its
      stamp matches this build's inputs.
    required: false
    default: 'false'
outputs:
  sm_asset:
    description: File name of the SourceMod package in packages/
    value: ${{ steps.check.outputs.sm_asset }}
  mm_asset:
    description: File name of the Metamod package in packages/
    value: ${{ steps.check.outputs.mm_asset }}
runs:
  using: composite
  steps:
    - name: Deps cache key (${{ inputs.line }})
      id: deps-key
      if: inputs.deps-cache == 'true'
      shell: bash
      env:
        CSS34_LINE: ${{ inputs.line }}
      run: |
        set -euo pipefail
        source builder/resolve-version.sh
        # Build image, deps path and the exact bytes of the scripts that build
        # the prefixes (their version and sha256 pins included); the SourceMod
        # pin decides which prefixes the line needs.
        key="$(python3 builder/deps_cache.py key --line "$CSS34_LINE" --sm-commit "$SOURCEMOD_COMMIT")"
        echo "key=${key}" >> "$GITHUB_OUTPUT"
        {
          echo 'paths<<CSS34_DEPS_PATHS'
          python3 builder/deps_cache.py paths
          echo 'CSS34_DEPS_PATHS'
        } >> "$GITHUB_OUTPUT"
        echo "Deps cache key: ${key}"

    - name: Restore built dependency prefixes
      id: deps-restore
      if: inputs.deps-cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.deps-key.outputs.paths }}
        key: ${{ steps.deps-key.outputs.key }}

    - name: Build SourceMod + Metamod (manylinux2014, ${{ inputs.line }})
      shell: bash
      env:
        CSS34_LINE: ${{ inputs.line }}
      run: builder/docker/build.sh

    - name: Static package checks
      id: check
      shell: bash
      env:
        CSS34_LINE: ${{ inputs.line }}
      run: |
        set -euo pipefail
        source builder/package-paths.sh
        test -f "$SM_PACKAGE" && test -f "$MM_PACKAGE"
        echo "Checking ${SM_PACKAGE}"
        testing/scripts/check-package.sh
        # One MM package (MM 1.12, with the bridge's metamod.1.ep1 legacy core).
        testing/scripts/verify-line-metamod-packages.sh "$CSS34_LINE"
        # Exact names of what this run built: later jobs never glob.
        echo "sm_asset=$(basename "$SM_PACKAGE")" >> "$GITHUB_OUTPUT"
        echo "mm_asset=$(basename "$MM_PACKAGE")" >> "$GITHUB_OUTPUT"

    # After the static checks: only prefixes of a build whose packages passed.
    - name: Save built dependency prefixes
      if: inputs.deps-cache == 'true' && steps.deps-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.deps-key.outputs.paths }}
        key: ${{ steps.deps-key.outputs.key }}
