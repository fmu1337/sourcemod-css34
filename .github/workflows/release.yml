name: Release

# Tag → CSS34_LINE comes from builder/generated/tag-map.sh (python3 builder/lines.py gen).
# A packaging rebuild of the same pins uses a `-r<N>` suffix; the base tag selects the line.
# Lines with releasable=false (archived MM 2.0 / KHook) are rejected.
# known_bad tags can resolve to a line but can never publish a line pointer.
#
# Linux/Windows jobs attach packages directly to the GitHub Release.
# No Actions artifacts (those count against the 0.5 GB storage quota).
#
# Release invariants (consumed by fmu1337/v34_server_base):
#   * A release is created published and is never turned back into a draft;
#     re-runs only `gh release upload --clobber` into it (a draft found here is
#     re-published). Draft asset URLs 404.
#   * Asset names carry the revision (sourcemod-…-git7472-…, mmsource-…-git1226-…)
#     and every release has SHA256SUMS.
#   * smoke-release installs the *public* URLs with plain `tar -x` and boots
#     srcds; only on pass does line-pointer switch line-<line> (stable names,
#     see builder/scripts/update-line-pointer.sh), then smoke-pointer re-checks
#     the pointer URLs.
on:
  push:
    tags:
      - '*-mm*'
      # Pointer / index releases are created by this workflow itself.
      - '!line-*'
      - '!lines-*'
  pull_request:
    paths:
      - 'builder/lines.json'
      - 'builder/lines.py'
      - 'builder/generated/**'
      - 'builder/versions.env'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      css34_line:
        description: "CSS34_LINE for manual dispatch (ignored if repoint_tag is set)"
        required: false
        default: "sm13-latest"
      repoint_tag:
        description: "Target release tag to repoint line pointer to (e.g. 1.12.0.7255-mm1.12.0 or 1.12.0.7255-mm1.12.0-r2)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PURE_SOURCE_BUILD: "1"

jobs:
  print-tag-map:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print generated release tag map
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source builder/generated/tag-map.sh
          echo "=== builder/generated/tag-map.sh ==="
          cat builder/generated/tag-map.sh
          python3 - <<'PY' > /tmp/tag-map-rows.tsv
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("lines", "builder/lines.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          data = mod.load_manifest(Path("builder/lines.json"))
          for name in data["lines"]:
              part = mod.line_parts(data, name)
              tags = [part["tag"]] + part["extra_tags"]
              for tag in tags:
                  print("\t".join([
                      tag, name, "1" if part["pointer"] else "0",
                      "1" if part["releasable"] else "0",
                  ]))
          for tag in sorted(data["known_bad"]):
              print("\t".join(["known", tag]))
          PY
          echo "=== resolved tags ==="
          while IFS=$'\t' read -r kind a b c; do
            if [[ "$kind" == "known" ]]; then
              tag="$a"
              css34_tag_is_known_bad "$tag" || { echo "known_bad missing from tag map: $tag" >&2; exit 1; }
              if mapped="$(css34_line_for_tag "$tag")" && css34_line_has_pointer "$mapped"; then
                echo "known-bad tag $tag maps to pointer line $mapped" >&2
                exit 1
              fi
              echo "known-bad $tag (not a pointer)"
              continue
            fi
            tag="$kind"
            name="$a"
            pointer="$b"
            releasable="$c"
            mapped="$(css34_line_for_tag "$tag")" || { echo "tag $tag did not resolve" >&2; exit 1; }
            [[ "$mapped" == "$name" ]] || { echo "tag $tag resolved to $mapped, expected $name" >&2; exit 1; }
            if [[ "$pointer" == 1 ]]; then
              css34_line_has_pointer "$name" || { echo "$name should publish a pointer" >&2; exit 1; }
            elif css34_line_has_pointer "$name"; then
              echo "$name must not publish a pointer" >&2
              exit 1
            fi
            if [[ "$releasable" == 1 ]]; then
              css34_line_can_release "$name" || { echo "$name should be releasable" >&2; exit 1; }
            elif css34_line_can_release "$name"; then
              echo "archived line $name must not take a new release tag" >&2
              exit 1
            fi
            echo "$tag -> $name pointer=$pointer releasable=$releasable"
          done < /tmp/tag-map-rows.tsv
          echo "Tag map checks passed (no release published)"

  resolve-line:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    outputs:
      css34_line: ${{ steps.map.outputs.css34_line }}
      pointer: ${{ steps.map.outputs.pointer }}
      repoint: ${{ steps.map.outputs.repoint }}
      tag: ${{ steps.map.outputs.tag }}
      sm_asset: ${{ steps.map.outputs.sm_asset }}
      mm_asset: ${{ steps.map.outputs.mm_asset }}
      target_commit: ${{ steps.map.outputs.target_commit }}
      target_time: ${{ steps.map.outputs.target_time }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Map tag / input → CSS34_LINE
        id: map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOINT_TAG: ${{ inputs.repoint_tag || github.event.inputs.repoint_tag }}
          CSS34_LINE_INPUT: ${{ inputs.css34_line || github.event.inputs.css34_line }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source builder/generated/tag-map.sh
          known_bad=0
          repoint=0
          repoint_tag="${REPOINT_TAG:-}"
          sm_asset=""
          mm_asset=""
          target_commit=""
          target_time=""

          if [[ -n "$repoint_tag" ]]; then
            if [[ ! "$repoint_tag" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
              echo "Invalid repoint_tag format: $repoint_tag" >&2
              exit 1
            fi
            repoint=1
            tag="$repoint_tag"
            base="$tag"
            if [[ "$tag" =~ ^(.+)-r[0-9]+$ ]]; then
              base="${BASH_REMATCH[1]}"
            fi
            if css34_tag_is_known_bad "$base"; then
              echo "repoint_tag $base is known-bad and cannot be published as a pointer" >&2
              exit 1
            fi
            line="$(css34_line_for_tag "$base")" || {
              echo "Unknown repoint_tag '$repoint_tag'" >&2
              exit 1
            }
            pointer=1
            echo "Repointing line pointer for line ${line} to ${repoint_tag}"
            rel_info="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${repoint_tag}")"
            rel_assets="$(jq -r '.assets[].name' <<<"$rel_info")"
            sm_asset="$(grep -E '^sourcemod-.*-css34-linux\.tar\.gz$' <<<"$rel_assets" | head -n1)"
            mm_asset="$(grep -E '^mmsource-.*-css34-linux\.tar\.gz$' <<<"$rel_assets" | head -n1)"
            if [[ -z "$sm_asset" || -z "$mm_asset" ]]; then
              echo "Could not find SM/MM linux tarballs in release tag ${repoint_tag}" >&2
              exit 1
            fi
            commit_info="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${repoint_tag}")"
            target_commit="$(jq -r '.sha' <<<"$commit_info")"
            target_time="$(jq -r '.commit.committer.date | fromdateiso8601' <<<"$commit_info")"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            base="${tag}"
            if [[ "${tag}" =~ ^(.+)-r[0-9]+$ ]]; then
              base="${BASH_REMATCH[1]}"
            fi
            if css34_tag_is_known_bad "${base}"; then
              known_bad=1
            fi
            line="$(css34_line_for_tag "${base}")" || {
              echo "Unknown release tag '${tag}' — add the line in builder/lines.json and regenerate" >&2
              exit 1
            }
            if css34_line_has_pointer "${line}"; then
              pointer=1
            else
              pointer=0
            fi
            if [[ "$known_bad" == 1 ]]; then
              if [[ "$pointer" == 1 ]]; then
                echo "known-bad tag ${base} cannot be published as a line pointer" >&2
                exit 1
              fi
              pointer=0
            fi
          else
            line="${CSS34_LINE_INPUT:-}"
            if [[ -z "$line" ]]; then
              line="$(python3 -c 'import json; print(json.load(open("builder/lines.json"))["default_line"])')"
            fi
            tag="manual-${line}"
            pointer=0
          fi

          if ! css34_line_can_release "${line}"; then
            echo "Archived build line: use archive/khook; published pointers are unchanged" >&2
            exit 1
          fi

          echo "css34_line=${line}" >> "$GITHUB_OUTPUT"
          echo "pointer=${pointer}" >> "$GITHUB_OUTPUT"
          echo "repoint=${repoint}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sm_asset=${sm_asset}" >> "$GITHUB_OUTPUT"
          echo "mm_asset=${mm_asset}" >> "$GITHUB_OUTPUT"
          echo "target_commit=${target_commit}" >> "$GITHUB_OUTPUT"
          echo "target_time=${target_time}" >> "$GITHUB_OUTPUT"
          echo "Resolved CSS34_LINE=${line} tag=${tag} pointer=${pointer} repoint=${repoint}"

  linux:
    needs: [resolve-line]
    if: needs.resolve-line.outputs.repoint != '1'
    runs-on: ubuntu-22.04
    # Exact names of what this run built: a release can hold older assets
    # with other names (e.g. mmsource-…-dev-…), so later jobs never glob.
    outputs:
      sm_asset: ${{ steps.check.outputs.sm_asset }}
      mm_asset: ${{ steps.check.outputs.mm_asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build SourceMod + Metamod (manylinux2014 / pure-source)
        env:
          CSS34_LINE: ${{ needs.resolve-line.outputs.css34_line }}
          PURE_SOURCE_BUILD: "1"
        run: |
          chmod +x builder/docker/build.sh builder/run/linux.sh \
            builder/checkout-deps.sh builder/package.sh builder/package-metamod.sh \
            builder/build-metamod.sh builder/prepare-package.sh builder/write-build-stamps.sh \
            builder/resolve-version.sh builder/py.sh builder/patches/*.sh
          builder/docker/build.sh

      - name: Static package checks
        id: check
        run: |
          set -euo pipefail
          sm="$(ls packages/sourcemod-*-css34-linux.tar.gz)"
          mm="$(ls packages/mmsource-*-css34-linux.tar.gz)"
          [[ "$(wc -l <<<"${sm}")" == 1 && "$(wc -l <<<"${mm}")" == 1 ]] \
            || { echo "expected one SM + one MM linux package" >&2; ls packages >&2; exit 1; }
          SM_PACKAGE="${sm}" testing/scripts/check-package.sh
          MM_PACKAGE="${mm}" testing/scripts/check-metamod-package.sh
          echo "sm_asset=$(basename "${sm}")" >> "$GITHUB_OUTPUT"
          echo "mm_asset=$(basename "${mm}")" >> "$GITHUB_OUTPUT"

      - name: Attach Linux packages to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE: ${{ needs.resolve-line.outputs.css34_line }}
          CSS34_LINE: ${{ needs.resolve-line.outputs.css34_line }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="$(cat <<EOF
          CS:S v34 packages for tag \`${tag}\`.

          **Assets**
          - SourceMod Linux / Windows
          - Metamod:Source Linux / Windows

          Build line: \`${LINE}\` (pure-source, manylinux2014 Linux, glibc 2.17, no reference binary splice).
          Pins are resolved from \`builder/versions.env\` via \`builder/resolve-version.sh\`.
          Packages are attached directly to this Release (no Actions artifacts).
          EOF
          )"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${tag}" --notes "${notes}" --latest=false
          fi
          gh release upload "${tag}" \
            packages/sourcemod-*-css34-linux.tar.gz \
            packages/mmsource-*-css34-linux.tar.gz \
            --clobber
          # Never leave (or turn) a release as draft: its asset URLs would 404.
          if [[ "$(gh release view "${tag}" --json isDraft -q .isDraft)" == "true" ]]; then
            gh release edit "${tag}" --draft=false --latest=false
          fi

  windows:
    needs: [resolve-line]
    if: needs.resolve-line.outputs.repoint != '1'
    # Same pin as build.yml (builder/windows-toolchain.env).
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC (x86, toolset 14.44, SDK 10.0.26100.0)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: "14.44"
          sdk: 10.0.26100.0

      - name: Build SourceMod + Metamod for CS:S v34
        shell: bash
        env:
          CSS34_LINE: ${{ needs.resolve-line.outputs.css34_line }}
          PURE_SOURCE_BUILD: "1"
        run: |
          export WDIR="$PWD"
          chmod +x builder/run/windows.sh builder/checkout-deps.sh builder/prepare-package.sh \
            builder/build-metamod.sh builder/write-build-stamps.sh builder/resolve-version.sh \
            builder/py.sh builder/patches/*.sh
          builder/run/windows.sh
          source builder/package-paths.sh
          python builder/package_windows.py check "$SM_WIN_PACKAGE" "$MM_WIN_PACKAGE"

      - name: Attach Windows packages to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE: ${{ needs.resolve-line.outputs.css34_line }}
          CSS34_LINE: ${{ needs.resolve-line.outputs.css34_line }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="$(cat <<EOF
          CS:S v34 packages for tag \`${tag}\`.

          **Assets**
          - SourceMod Linux / Windows
          - Metamod:Source Linux / Windows

          Build line: \`${LINE}\` (pure-source, no reference binary splice).
          EOF
          )"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${tag}" --notes "${notes}" --latest=false
          fi
          source builder/package-paths.sh
          gh release upload "${tag}" \
            "$SM_WIN_PACKAGE" "$MM_WIN_PACKAGE" --clobber
          if [[ "$(gh release view "${tag}" --json isDraft -q .isDraft)" == "true" ]]; then
            gh release edit "${tag}" --draft=false --latest=false
          fi

  # SHA256SUMS over every asset of the tag release (Linux + Windows).
  checksums:
    needs: [resolve-line, linux, windows]
    if: always() && github.ref_type == 'tag' && needs.resolve-line.outputs.repoint != '1' && needs.linux.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir assets && cd assets
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" -p '*.tar.gz' -p '*.zip'
          sha256sum -- * | sort -k2 > ../SHA256SUMS
          cat ../SHA256SUMS
          gh release upload "${tag}" --repo "${GITHUB_REPOSITORY}" ../SHA256SUMS --clobber

  # Weekly OS list for this line, generated from lines.json (no hand-written rows).
  release-pins:
    if: github.ref_type == 'tag' || needs.resolve-line.outputs.repoint == '1'
    needs: [resolve-line]
    runs-on: ubuntu-22.04
    outputs:
      weekly: ${{ steps.m.outputs.weekly }}
      weekly_botplay: ${{ steps.m.outputs.weekly_botplay }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OS matrix for the released line
        id: m
        env:
          LINE: ${{ needs.resolve-line.outputs.css34_line }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("lines", "builder/lines.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          data = mod.load_manifest(Path("builder/lines.json"))
          matrix = mod.ci_matrix(data)
          line = os.environ["LINE"]
          weekly = [row for row in matrix["weekly"] if row["line"] == line]
          botplay = [row for row in matrix["weekly_botplay"] if row["line"] == line]
          if not weekly or not botplay:
              raise SystemExit("empty release OS matrix for " + line)
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              for name, rows in (("weekly", weekly), ("weekly_botplay", botplay)):
                  fh.write("{0}<<EOF\n{1}\nEOF\n".format(name, json.dumps(rows)))
          PY

  # Installer contract on the *published* URLs: plain tar -x + srcds boot
  # on every weekly image (debian 8–11, ubuntu 14.04/16.04/18.04, rockylinux 9).
  smoke-release:
    needs: [resolve-line, linux, checksums, release-pins]
    if: >-
      always() && needs.resolve-line.result == 'success' && needs.release-pins.result == 'success' &&
      ((github.ref_type == 'tag' && needs.linux.result == 'success' && needs.checksums.result == 'success') ||
       needs.resolve-line.outputs.repoint == '1')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-pins.outputs.weekly) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached server tree
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-1-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}

      - name: Prepare server tree (cache miss)
        if: steps.server-cache.outputs.cache-hit != 'true'
        env:
          SERVER_DIR: ${{ github.workspace }}/.ci-server
          CACHE_DIR: ${{ github.workspace }}/.ci-cache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip unrar
          chmod +x testing/scripts/*.sh
          testing/scripts/fetch-server.sh
          testing/scripts/apply-valve-rc-fix.sh
          testing/scripts/apply-srcds-patch.sh
          KEEP_MAPS=de_dust2,de_inferno,de_nuke testing/scripts/trim-server-maps.sh
          mkdir -p server-art
          tar -C .ci-server -czf server-art/css34-server.tar.gz .
          rm -rf .ci-server

      - name: Smoke public release URLs in ${{ matrix.image_name }}
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve-line.outputs.tag }}
          SM_ASSET: ${{ needs.linux.outputs.sm_asset || needs.resolve-line.outputs.sm_asset }}
          MM_ASSET: ${{ needs.linux.outputs.mm_asset || needs.resolve-line.outputs.mm_asset }}
          IMAGE: ${{ matrix.image }}
        run: |
          chmod +x testing/scripts/*.sh
          testing/scripts/release-smoke.sh

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logs-${{ matrix.image_name }}
          retention-days: 7
          path: |
            .ci-server/smoke.log
            .ci-server/console-probe.log
            .ci-server/cstrike/addons/sourcemod/logs/*.log

  # Weekly botplay on centos:7 against the published URLs.
  botplay-release:
    needs: [resolve-line, linux, checksums, release-pins]
    if: >-
      always() && needs.resolve-line.result == 'success' && needs.release-pins.result == 'success' &&
      ((github.ref_type == 'tag' && needs.linux.result == 'success' && needs.checksums.result == 'success') ||
       needs.resolve-line.outputs.repoint == '1')
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-pins.outputs.weekly_botplay) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached server tree
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-1-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}

      - name: Prepare server tree (cache miss)
        if: steps.server-cache.outputs.cache-hit != 'true'
        env:
          SERVER_DIR: ${{ github.workspace }}/.ci-server
          CACHE_DIR: ${{ github.workspace }}/.ci-cache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip unrar
          chmod +x testing/scripts/*.sh
          testing/scripts/fetch-server.sh
          testing/scripts/apply-valve-rc-fix.sh
          testing/scripts/apply-srcds-patch.sh
          KEEP_MAPS=de_dust2,de_inferno,de_nuke testing/scripts/trim-server-maps.sh
          mkdir -p server-art
          tar -C .ci-server -czf server-art/css34-server.tar.gz .
          rm -rf .ci-server

      - name: Botplay public release URLs on ${{ matrix.image_name }}
        env:
          IMAGE: ${{ matrix.image }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve-line.outputs.tag }}
          SM_ASSET: ${{ needs.linux.outputs.sm_asset || needs.resolve-line.outputs.sm_asset }}
          MM_ASSET: ${{ needs.linux.outputs.mm_asset || needs.resolve-line.outputs.mm_asset }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          RECORD_SECS: "300"
        run: |
          set -euo pipefail
          chmod +x testing/scripts/*.sh
          mkdir -p packages
          curl -fL --retry 8 --retry-delay 5 -o "packages/${SM_ASSET}" "${BASE_URL}/${SM_ASSET}"
          curl -fL --retry 8 --retry-delay 5 -o "packages/${MM_ASSET}" "${BASE_URL}/${MM_ASSET}"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -e SERVER_DIR=/workspace/.ci-server \
            -e CACHE_DIR=/workspace/.ci-cache \
            -e RECORD_SECS \
            -e BOTPLAY_PROFILE=release \
            -e BOTPLAY_CFG=botplay-stress.cfg \
            -e BOTPLAY_MAPS=de_dust2,de_inferno,de_nuke \
            -e MM_VERSION_EXPECT \
            -e SM_VERSION_EXPECT \
            -e SM_PACKAGE="/workspace/packages/${SM_ASSET}" \
            -e MM_PACKAGE="/workspace/packages/${MM_ASSET}" \
            -e REPORT_JSON=/workspace/.ci-server/botplay-report.json \
            -e REPORT_TXT=/workspace/.ci-server/botplay-report.txt \
            -e SMOKE_CONDEBUG=1 \
            -e SMOKE_VERBOSE=1 \
            -e CSS34_CI=1 \
            -w /workspace \
            "${IMAGE}" \
            bash -lc '
              set -euo pipefail
              rm -rf /workspace/.ci-server
              mkdir -p /workspace/.ci-server /workspace/.ci-cache
              tar -xzf /workspace/server-art/css34-server.tar.gz -C /workspace/.ci-server
              testing/scripts/install-deps.sh
              testing/scripts/botplay-test.sh
            '

      - name: Upload botplay logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-botplay-logs-${{ matrix.line }}
          retention-days: 7
          path: |
            .ci-server/botplay-report.json
            .ci-server/botplay-report.txt
            .ci-server/botplay.log
            .ci-server/cstrike/addons/sourcemod/logs/*.log

  # Switch line-<line> only after a green public-URL smoke and centos:7 botplay.
  # On red, record the failed candidate and keep serving the previous build.
  line-pointer:
    needs: [resolve-line, linux, smoke-release, botplay-release]
    if: >-
      always() &&
      needs.resolve-line.outputs.pointer == '1' &&
      (needs.smoke-release.result == 'success' || needs.smoke-release.result == 'failure') &&
      (needs.botplay-release.result == 'success' || needs.botplay-release.result == 'failure') &&
      ((github.ref_type == 'tag' && needs.linux.result == 'success') || needs.resolve-line.outputs.repoint == '1')
    runs-on: ubuntu-22.04
    # One writer per line-<line>. Per line, not global: a concurrency group holds
    # one running + one pending job and a newer pending one cancels it, so a
    # global group would silently drop pointers when several lines are tagged
    # together. Cross-line safety of lines-index is handled in the script.
    concurrency:
      group: css34-line-pointer-${{ needs.resolve-line.outputs.css34_line }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tag assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-line.outputs.tag }}
          SM_ASSET: ${{ needs.linux.outputs.sm_asset || needs.resolve-line.outputs.sm_asset }}
          MM_ASSET: ${{ needs.linux.outputs.mm_asset || needs.resolve-line.outputs.mm_asset }}
        run: |
          set -euo pipefail
          mkdir -p ptr
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" -D ptr \
            -p "${SM_ASSET}" -p "${MM_ASSET}"

      - name: Update line-${{ needs.resolve-line.outputs.css34_line }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE: ${{ needs.smoke-release.result == 'success' && needs.botplay-release.result == 'success' && 'pass' || 'fail' }}
          LINE: ${{ needs.resolve-line.outputs.css34_line }}
          TAG: ${{ needs.resolve-line.outputs.tag }}
          SM_ASSET: ${{ needs.linux.outputs.sm_asset || needs.resolve-line.outputs.sm_asset }}
          MM_ASSET: ${{ needs.linux.outputs.mm_asset || needs.resolve-line.outputs.mm_asset }}
          TARGET: ${{ needs.resolve-line.outputs.target_commit || github.sha }}
          SRC_TIME: ${{ needs.resolve-line.outputs.target_time }}
          FORCE_REPOINT: ${{ needs.resolve-line.outputs.repoint }}
        run: |
          set -euo pipefail
          bash builder/scripts/update-line-pointer.sh "${LINE}" "${TAG}" \
            "ptr/${SM_ASSET}" "ptr/${MM_ASSET}"
          if [[ "${SMOKE}" != "pass" ]]; then
            echo "::error::smoke failed for ${TAG}; line-${LINE} not switched"
            exit 1
          fi

  smoke-pointer:
    needs: [resolve-line, line-pointer]
    if: always() && needs.resolve-line.outputs.pointer == '1' && needs.line-pointer.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached server tree
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-1-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}

      - name: Prepare server tree (cache miss)
        if: steps.server-cache.outputs.cache-hit != 'true'
        env:
          SERVER_DIR: ${{ github.workspace }}/.ci-server
          CACHE_DIR: ${{ github.workspace }}/.ci-cache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip unrar
          chmod +x testing/scripts/*.sh
          testing/scripts/fetch-server.sh
          testing/scripts/apply-valve-rc-fix.sh
          testing/scripts/apply-srcds-patch.sh
          KEEP_MAPS=de_dust2,de_inferno,de_nuke testing/scripts/trim-server-maps.sh
          mkdir -p server-art
          tar -C .ci-server -czf server-art/css34-server.tar.gz .
          rm -rf .ci-server

      - name: Smoke pointer URLs
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/line-${{ needs.resolve-line.outputs.css34_line }}
          LINE: ${{ needs.resolve-line.outputs.css34_line }}
          TAG: ${{ needs.resolve-line.outputs.tag }}
          SM_ASSET: sourcemod-css34-linux.tar.gz
          MM_ASSET: mmsource-css34-linux.tar.gz
        run: |
          set -euo pipefail
          chmod +x testing/scripts/*.sh
          # A later tag of the same line may already have switched the pointer;
          # that is fine — whatever it serves must be a smoke-passed build.
          curl -fsSL "${BASE_URL}/lines.json" | LINE="${LINE}" TAG="${TAG}" python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)[os.environ["LINE"]]
          print(json.dumps(d, indent=2))
          assert d["smoke"] == "pass" and d["tag"], "pointer does not serve a smoke-passed build"
          served, tag = d["tag"], os.environ.get("TAG", "")
          if tag and served != tag:
              print(f"::notice::line pointer serves {served} (target was {tag})")
          '
          testing/scripts/release-smoke.sh
