name: Release Maintenance

# Three maintenance actions, picked with the `mode` input.
#   republish       — flip drafts back to published (draft asset URLs 404 for
#                     installers). Touches no tags or assets.
#   mark-known-bad  — turn every release listed in builder/lines.json
#                     `known_bad` into a prerelease with a banner (asset URLs keep
#                     working), then make `latest_tag` the GitHub "Latest" release.
#                     Touches no tags or assets.
#   supersede       — for every line-* pointer, put a "superseded by <tag>" banner
#                     on the older build releases of that line
#                     (builder/scripts/supersede-releases.py; release.yml does the
#                     same after each pointer move). Touches no tags or assets.
# There is no delete mode: a published release is never deleted, because other
# repositories' CI and scripts link to its assets (README "Release retention").
# Empty inputs are worked out at run time, so no tag is hard-coded here: a
# stale default would make an old build "Latest".
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "republish | mark-known-bad | supersede"
        type: choice
        options: [republish, mark-known-bad, supersede]
        default: republish
      latest_tag:
        description: "mark-known-bad: release to mark as GitHub Latest (empty = the tag line-<default_line> serves)"
        required: false
        default: ""
      tags:
        description: "republish: space-separated release tags to re-publish (empty = every draft release)"
        required: false
        default: ""
      dry_run:
        description: "supersede: only print what would change"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  republish:
    if: github.event.inputs.mode == 'republish'
    runs-on: ubuntu-22.04
    steps:
      - name: Publish drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          set -euo pipefail
          rc=0
          if [[ -z "${TAGS// /}" ]]; then
            TAGS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              -q '.[] | select(.draft) | .tag_name')"
            [[ -n "${TAGS}" ]] || { echo "no draft releases"; exit 0; }
            echo "drafts: ${TAGS//$'\n'/ }"
          fi
          for tag in ${TAGS}; do
            if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} does not exist; not publishing a tagless draft"
              rc=1
              continue
            fi
            # `gh release view <tag>` cannot see drafts by tag; list instead.
            draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              -q ".[] | select(.tag_name == \"${tag}\") | .draft")"
            case "${draft}" in
              true)
                id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                  -q ".[] | select(.tag_name == \"${tag}\") | .id")"
                gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
                  -F draft=false -f make_latest=false >/dev/null
                echo "published ${tag}"
                ;;
              false) echo "${tag} already published" ;;
              *) echo "::error::no release for ${tag}"; rc=1 ;;
            esac
          done
          exit "${rc}"

  mark-known-bad:
    if: github.event.inputs.mode == 'mark-known-bad'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark known-bad releases as prereleases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ github.event.inputs.latest_tag }}
        run: |
          set -euo pipefail
          marker='<!-- css34-known-bad -->'
          rc=0
          while IFS=$'\t' read -r tag reason; do
            [[ -n "${tag}" ]] || continue
            if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >release.json 2>/dev/null; then
              echo "::warning::no published release for ${tag}; skipped"
              continue
            fi
            id="$(jq -r .id release.json)"
            if jq -e --arg m "${marker}" '.body // "" | contains($m)' release.json >/dev/null; then
              body="$(jq -r '.body // ""' release.json)"
            else
              banner="${marker}"$'\n'"> [!WARNING]"$'\n'"> **KNOWN BAD — do not install.** ${reason}"$'\n'"> Use a \`line-<line>\` pointer release instead (see README)."$'\n\n'
              body="${banner}$(jq -r '.body // ""' release.json)"
            fi
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
                -F prerelease=true -f make_latest=false -f body="${body}" >/dev/null; then
              echo "marked ${tag}"
            else
              echo "::error::failed to mark ${tag}"; rc=1
            fi
          done < <(jq -r '.known_bad | to_entries[] | "\(.key)\t\(.value)"' builder/lines.json)

          if [[ -z "${LATEST_TAG}" ]]; then
            line="$(jq -r .default_line builder/lines.json)"
            LATEST_TAG="$(curl -fsSL --retry 3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/line-${line}/lines.json" \
              | jq -r --arg l "${line}" '.[$l] | select(.smoke == "pass") | .tag // empty')"
            [[ -n "${LATEST_TAG}" ]] || { echo "::error::line-${line} serves no smoke-passed tag"; exit 1; }
            echo "Latest = what line-${line} serves: ${LATEST_TAG}"
          fi
          if [[ -n "${LATEST_TAG}" ]]; then
            if jq -e --arg t "${LATEST_TAG}" '.known_bad | has($t)' builder/lines.json >/dev/null; then
              echo "::error::${LATEST_TAG} is listed as known bad"; exit 1
            fi
            id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${LATEST_TAG}" -q .id)"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
              -F prerelease=false -F draft=false -f make_latest=true >/dev/null
          fi
          echo "GitHub Latest is now: $(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name)"
          exit "${rc}"

  supersede:
    if: github.event.inputs.mode == 'supersede'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark releases superseded by what each line pointer serves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          rc=0
          args=()
          if [[ "${DRY_RUN}" == true ]]; then args+=(--dry-run); fi
          while read -r pointer; do
            line="${pointer#line-}"
            if ! gh release download "$pointer" --pattern lines.json --output - > "$RUNNER_TEMP/pointer.json" 2>/dev/null; then
              echo "::warning::${pointer} has no lines.json; skipped"
              continue
            fi
            served="$(jq -r --arg l "$line" '.[$l] | select(.smoke == "pass") | .tag // empty' "$RUNNER_TEMP/pointer.json")"
            if [[ -z "$served" ]]; then
              echo "${pointer} serves no smoke-passed build; skipped"
              continue
            fi
            echo "=== ${pointer} serves ${served}"
            python3 builder/scripts/supersede-releases.py --repo "${GITHUB_REPOSITORY}" \
              --line "$line" --served "$served" ${args[@]+"${args[@]}"} || rc=1
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            -q '.[] | select(.draft == false and (.tag_name | startswith("line-"))) | .tag_name')
          exit "$rc"
