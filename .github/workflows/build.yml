name: Build

on:
  push:
    branches:
      - master
      - 'cursor/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/cleanup-artifacts.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/cleanup-artifacts.yml'
  workflow_dispatch:

env:
  CSS34_LINE: sm13-dev
  PURE_SOURCE_BUILD: "1"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            g++-9-multilib \
            gcc-9-multilib \
            git \
            lib32stdc++-9-dev \
            lib32stdc++6 \
            lib32z1-dev \
            libc6-dev-i386 \
            libstdc++-9-dev \
            linux-libc-dev \
            libssl-dev:i386 \
            python3 \
            python3-pip

      - name: Build SourceMod + Metamod for CS:S v34
        env:
          SKIP_APT_INSTALL: 1
          CC: gcc-9
          CXX: g++-9
          CSS34_LINE: ${{ env.CSS34_LINE }}
          PURE_SOURCE_BUILD: ${{ env.PURE_SOURCE_BUILD }}
        run: |
          export WDIR="$PWD"
          chmod +x builder/run/linux.sh builder/checkout-deps.sh builder/package.sh \
            builder/package-metamod.sh builder/build-metamod.sh builder/prepare-package.sh \
            builder/write-build-stamps.sh builder/resolve-version.sh builder/py.sh builder/patches/*.sh
          builder/run/linux.sh

      - name: Confirm Linux packages exist
        run: ls -lh packages/sourcemod-*-css34-linux.tar.gz packages/mmsource-*-css34-linux.tar.gz

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        line: [sm13-dev, sm13-mm20-khook]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build SourceMod + Metamod for CS:S v34 (${{ matrix.line }})
        shell: bash
        env:
          CSS34_LINE: ${{ matrix.line }}
          PURE_SOURCE_BUILD: ${{ env.PURE_SOURCE_BUILD }}
        run: |
          export WDIR="$PWD"
          chmod +x builder/run/windows.sh builder/checkout-deps.sh builder/prepare-package.sh \
            builder/build-metamod.sh builder/write-build-stamps.sh builder/resolve-version.sh \
            builder/py.sh builder/patches/*.sh
          builder/run/windows.sh

      - name: Confirm Windows packages exist
        shell: bash
        run: |
          ls -lh packages/sourcemod-*-css34-windows.zip packages/mmsource-*-css34-windows.zip
          if [[ "${{ matrix.line }}" == "sm13-mm20-khook" ]]; then
            unzip -l packages/sourcemod-*-css34-windows.zip | grep -i 'dhooks.ext.dll'
          fi

      # Packages + debug symbols for wine-smoke (Actions cache, not artifact storage)
      - name: Collect packages and PDBs
        shell: bash
        run: |
          mkdir -p win-art/pdb
          cp packages/sourcemod-*-css34-windows.zip packages/mmsource-*-css34-windows.zip win-art/
          find sourcemod/build deps -name '*.pdb' -path '*build*' -exec cp -f {} win-art/pdb/ \;
          ls -la win-art win-art/pdb

      - name: Cache packages for wine-smoke
        uses: actions/cache/save@v4
        with:
          path: win-art
          key: css34-win-${{ github.run_id }}-${{ matrix.line }}

  # Boots the Windows packages on the Windows CS:S v34 server (srcds.exe) under Wine
  wine-smoke:
    needs: windows
    # Test each line whose Windows build succeeded (a missing package fails on the cache miss)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: sm13-dev
            sm_expect: "1.13.0.7404"
            mm_expect: "1.12.0"
            exts: "CS Tools,SDK Tools,BinTools"
            load_exts: ""
          - line: sm13-mm20-khook
            sm_expect: "1.13.0.7565"
            mm_expect: "2.0.0"
            exts: "CS Tools,SDK Tools,BinTools,SDK Hooks,DHooks"
            load_exts: "sdkhooks.ext,dhooks.ext"
    steps:
      - name: Install Wine
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            wine32 wine xvfb unzip curl ca-certificates python3 binutils llvm-14 git
          ln -sf /usr/bin/llvm-symbolizer-14 /usr/local/bin/llvm-symbolizer

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Windows packages
        uses: actions/cache/restore@v4
        with:
          path: win-art
          key: css34-win-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true

      # Game content from test-server.yml prepare-server (same key); downloaded on a miss
      - name: Restore server tree
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-1-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}

      - name: Wine smoke test (${{ matrix.line }})
        shell: bash
        env:
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          EXPECT_EXTS: ${{ matrix.exts }}
          LOAD_EXTS: ${{ matrix.load_exts }}
          PDB_DIR: ${{ github.workspace }}/win-art/pdb
        run: |
          export SM_WIN_PACKAGE="$(ls win-art/sourcemod-*-css34-windows.zip)"
          export MM_WIN_PACKAGE="$(ls win-art/mmsource-*-css34-windows.zip)"
          [[ -f server-art/css34-server.tar.gz ]] && export SERVER_TGZ="$PWD/server-art/css34-server.tar.gz"
          bash testing/scripts/wine-smoke-test.sh
