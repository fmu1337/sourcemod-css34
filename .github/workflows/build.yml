name: Build

on:
  push:
    branches:
      - master
      - 'cursor/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/cleanup-artifacts.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/cleanup-artifacts.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PURE_SOURCE_BUILD: "1"

jobs:
  pins:
    runs-on: ubuntu-22.04
    outputs:
      windows: ${{ steps.m.outputs.windows }}
      default_line: ${{ steps.m.outputs.default_line }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Emit CI matrices from lines.json
        id: m
        run: python3 builder/lines.py gha >> "$GITHUB_OUTPUT"

      - name: Windows zip layout self-test
        run: python3 builder/package_windows.py self-test

  linux:
    needs: pins
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build SourceMod + Metamod for CS:S v34 (manylinux2014)
        env:
          CSS34_LINE: ${{ needs.pins.outputs.default_line }}
          PURE_SOURCE_BUILD: ${{ env.PURE_SOURCE_BUILD }}
        run: |
          chmod +x builder/docker/build.sh builder/run/linux.sh builder/checkout-deps.sh \
            builder/package.sh builder/package-metamod.sh builder/build-metamod.sh \
            builder/prepare-package.sh builder/write-build-stamps.sh \
            builder/resolve-version.sh builder/py.sh builder/patches/*.sh
          builder/docker/build.sh

      - name: Confirm Linux packages exist
        run: ls -lh packages/sourcemod-*-css34-linux.tar.gz packages/mmsource-*-css34-linux.tar.gz

  windows:
    needs: pins
    # Pin the image. windows-latest moves, and with it the default MSVC toolset.
    # toolset/sdk match builder/windows-toolchain.env (-vcvars_ver=14.44).
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pins.outputs.windows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC (x86, toolset 14.44, SDK 10.0.26100.0)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: "14.44"
          sdk: 10.0.26100.0

      - name: Build SourceMod + Metamod for CS:S v34 (${{ matrix.line }})
        shell: bash
        env:
          CSS34_LINE: ${{ matrix.line }}
          PURE_SOURCE_BUILD: ${{ env.PURE_SOURCE_BUILD }}
        run: |
          export WDIR="$PWD"
          chmod +x builder/run/windows.sh builder/checkout-deps.sh builder/prepare-package.sh \
            builder/build-metamod.sh builder/write-build-stamps.sh builder/resolve-version.sh \
            builder/py.sh builder/patches/*.sh
          builder/run/windows.sh

      - name: Confirm Windows packages exist
        shell: bash
        run: |
          ls -lh packages/sourcemod-*-css34-windows.zip packages/mmsource-*-css34-windows.zip
          python builder/package_windows.py check \
            packages/sourcemod-*-css34-windows.zip \
            packages/mmsource-*-css34-windows.zip
          if command -v unzip >/dev/null 2>&1; then
            unzip -l packages/sourcemod-*-css34-windows.zip
            unzip -l packages/mmsource-*-css34-windows.zip
          fi

      # Packages + debug symbols for wine-smoke (Actions cache, not artifact storage)
      - name: Collect packages and PDBs
        shell: bash
        run: |
          mkdir -p win-art/pdb
          cp packages/sourcemod-*-css34-windows.zip packages/mmsource-*-css34-windows.zip win-art/
          find sourcemod/build deps -name '*.pdb' -path '*build*' -exec cp -f {} win-art/pdb/ \;
          ls -la win-art win-art/pdb

      - name: Cache packages for wine-smoke
        uses: actions/cache/save@v4
        with:
          path: win-art
          key: css34-win-${{ github.run_id }}-${{ matrix.line }}
          # restored by the Linux wine-smoke job
          enableCrossOsArchive: true

      # Native Windows smoke: the same test as wine-smoke, srcds.exe run directly
      - name: Cache CS:S v34 server zips (Windows)
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/srcds_css34_4044.zip
            .ci-cache/srcds_css34_w_a.zip
          key: css34-win-server-zips-v1

      - name: Windows smoke test (${{ matrix.line }})
        shell: bash
        env:
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          MM_REV_EXPECT: ${{ matrix.mm_rev }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          EXPECT_EXTS: ${{ matrix.exts }}
          LOAD_EXTS: ${{ matrix.load_exts }}
          # css34_dhooks_probe with bots (skipped when the package has no dhooks.ext.dll)
          DHOOKS_PROBE_SECS: "150"
        run: |
          export SM_WIN_PACKAGE="$(ls "$PWD"/win-art/sourcemod-*-css34-windows.zip)"
          export MM_WIN_PACKAGE="$(ls "$PWD"/win-art/mmsource-*-css34-windows.zip)"
          export PDB_DIR="$PWD/win-art/pdb"
          bash testing/scripts/wine-smoke-test.sh

      - name: Upload Windows smoke logs and crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ matrix.line }}
          path: |
            .ci-winserver/cstrike/console.log
            .ci-winserver/cstrike/addons/sourcemod/logs/
            .ci-winserver/dumps/
          if-no-files-found: ignore
          retention-days: 7

  # Boots the Windows packages on the Windows CS:S v34 server (srcds.exe) under Wine
  wine-smoke:
    needs: [pins, windows]
    # Test each line whose Windows build succeeded (a missing package fails on the cache miss)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pins.outputs.windows) }}
    steps:
      # zstd: actions/cache picks the compression from the tools present, and the
      # Windows / host-runner entries are zstd (a gzip restore misses them)
      - name: Install Wine
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            wine32 wine xvfb unzip curl ca-certificates python3 binutils llvm-14 git zstd
          ln -sf /usr/bin/llvm-symbolizer-14 /usr/local/bin/llvm-symbolizer

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Windows packages
        uses: actions/cache/restore@v4
        with:
          path: win-art
          key: css34-win-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      # Game content from test-server.yml prepare-server (same key); downloaded on a miss
      - name: Restore server tree
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-1-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}

      - name: Wine smoke test (${{ matrix.line }})
        shell: bash
        env:
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          MM_REV_EXPECT: ${{ matrix.mm_rev }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          EXPECT_EXTS: ${{ matrix.exts }}
          LOAD_EXTS: ${{ matrix.load_exts }}
          # css34_dhooks_probe with bots (skipped when the package has no dhooks.ext.dll)
          DHOOKS_PROBE_SECS: "150"
        run: |
          export SM_WIN_PACKAGE="$(ls win-art/sourcemod-*-css34-windows.zip)"
          export MM_WIN_PACKAGE="$(ls win-art/mmsource-*-css34-windows.zip)"
          # github.workspace is the host path, not the container's
          export PDB_DIR="$PWD/win-art/pdb"
          [[ -f server-art/css34-server.tar.gz ]] && export SERVER_TGZ="$PWD/server-art/css34-server.tar.gz"
          echo "==== unzip -l ${SM_WIN_PACKAGE} ===="
          unzip -l "${SM_WIN_PACKAGE}"
          echo "==== unzip -l ${MM_WIN_PACKAGE} ===="
          unzip -l "${MM_WIN_PACKAGE}"
          python3 builder/package_windows.py check "${SM_WIN_PACKAGE}" "${MM_WIN_PACKAGE}"
          bash testing/scripts/wine-smoke-test.sh
