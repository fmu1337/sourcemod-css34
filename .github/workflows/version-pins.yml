name: Version Pins

on:
  pull_request:
    paths:
      - 'builder/versions.env'
      - 'builder/generated/**'
      - 'builder/lines.json'
      - 'builder/lines.py'
      - 'README.md'
      - 'builder/resolve-version.sh'
      - 'testing/scripts/test-lines.py'
      - 'testing/scripts/check-version-copies.sh'
      - 'builder/checkout-deps.sh'
      - 'builder/write-build-stamps.sh'
      - 'builder/scripts/**'
      - 'testing/versions/matrix.json'
      - 'testing/scripts/check-version-pins.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/test-server.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/version-pins.yml'
  push:
    branches:
      - master
    paths:
      - 'builder/versions.env'
      - 'builder/generated/**'
      - 'builder/lines.json'
      - 'builder/lines.py'
      - 'README.md'
      - 'builder/resolve-version.sh'
      - 'testing/scripts/test-lines.py'
      - 'testing/scripts/check-version-copies.sh'
      - 'builder/checkout-deps.sh'
      - 'builder/write-build-stamps.sh'
      - 'testing/versions/matrix.json'
      - 'testing/scripts/check-version-pins.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/test-server.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  check-pins:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version pin consistency
        run: python3 builder/lines.py check

      - name: Test pin generation
        run: python3 testing/scripts/test-lines.py
