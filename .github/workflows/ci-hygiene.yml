name: CI Hygiene

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'builder/**'
      - 'testing/scripts/check-package-paths.sh'
      - 'testing/scripts/check-metamod-package.sh'
      - 'testing/scripts/verify-line-metamod-packages.sh'
      - 'testing/scripts/check-*imports.py'
      - 'testing/scripts/test-*.py'
      - 'testing/scripts/console-probe.exp'
      - 'testing/unversioned-imports.txt'
      - 'testing/scripts/smoke-test.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install regression test tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils expect
      - name: Check unversioned imports and PostgreSQL shim
        run: python3 testing/scripts/test-glibc-imports.py
      - name: Check console probe recovery
        run: python3 testing/scripts/test-console-probe.py
      - name: Check exact package selection
        run: bash testing/scripts/check-package-paths.sh
      - name: Check Metamod metadata and required packages
        run: python3 testing/scripts/test-check-metamod-package.py
      - name: Check release selection and Docker debug opt-in
        run: python3 testing/scripts/test-release-build-entrypoints.py
      - name: Check PLAPI factory contract
        run: python3 testing/scripts/test-plapi-probe.py
      # Negative test: an absent server must fail smoke and leave a downloadable
      # diagnostic after the workflow completes. Production smoke gates are unchanged.
      - name: Intentionally fail smoke with a missing server
        id: negative-smoke
        continue-on-error: true
        shell: bash
        env:
          SERVER_DIR: ${{ runner.temp }}/absent-css34-server
        run: |
          mkdir -p "$SERVER_DIR"
          bash testing/scripts/smoke-test.sh 2>&1 | tee negative-smoke.log
      - name: Require the expected failure
        env:
          OUTCOME: ${{ steps.negative-smoke.outcome }}
        run: |
          test "$OUTCOME" = failure
          grep -q 'No srcds_i686/i486 binary found' negative-smoke.log
      - name: Preserve negative smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negative-smoke-logs
          path: negative-smoke.log
          if-no-files-found: error
          retention-days: 7
