name: CI

permissions:
  contents: read
  actions: read
  pull-requests: read

on:
  push:
    branches:
      - master
      - 'cursor/**'
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      suite:
        description: "pr = centos:7 + ubuntu:24.04 + debian:13; weekly = old OS matrix"
        type: choice
        options:
          - pr
          - weekly
        required: false
        default: pr
      apply_srcds_patch:
        description: "Apply BufferFix ELF rewrite memcpy→memmove (1/0)"
        required: false
        default: "1"
      css34_line:
        description: "Optional single CSS34_LINE (sm11-oldstable|sm12-latest|sm13-latest); empty = matrix"
        required: false
        default: ""
      record_secs:
        description: "Botplay recording length in seconds (full matrix uses botplay-stress.cfg)"
        required: false
        default: "600"
      run_full_botplay_matrix:
        description: "Run botplay-stress matrix for all CSS34_LINE builds (master gate)"
        type: boolean
        required: false
        default: true
      run_reference_botplay:
        description: "Run rom4s / GitHub Release reference botplay jobs (not pure-source)"
        type: boolean
        required: false
        default: false
      botplay_extra_distros:
        description: "Also run botplay on debian:11, debian:12, rockylinux:9"
        type: boolean
        required: false
        default: false
      run_botplay_bisect:
        description: "Run slow botplay bisect matrix (diagnostics)"
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PURE_SOURCE_BUILD: "1"

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      code_changed: ${{ steps.planner.outputs.code_changed }}
      run_code_jobs: ${{ steps.planner.outputs.run_code_jobs }}
      run_pr_smoke: ${{ steps.planner.outputs.run_pr_smoke }}
      run_weekly_smoke: ${{ steps.planner.outputs.run_weekly_smoke }}
      run_windows: ${{ steps.planner.outputs.run_windows }}
      run_host: ${{ steps.planner.outputs.run_host }}
      run_release_botplay: ${{ steps.planner.outputs.run_release_botplay }}
      run_check_pins: ${{ steps.planner.outputs.run_check_pins }}
      run_built_botplay_extra: ${{ steps.planner.outputs.run_built_botplay_extra }}
      default_line: ${{ steps.planner.outputs.default_line }}
      required_jobs: ${{ steps.planner.outputs.required_jobs }}
      build: ${{ steps.planner.outputs.build }}
      debian: ${{ steps.planner.outputs.debian }}
      botplay: ${{ steps.planner.outputs.botplay }}
      weekly: ${{ steps.planner.outputs.weekly }}
      weekly_botplay: ${{ steps.planner.outputs.weekly_botplay }}
      host: ${{ steps.planner.outputs.host }}
      windows: ${{ steps.planner.outputs.windows }}
      windows_smoke: ${{ steps.planner.outputs.windows_smoke }}
      release_botplay: ${{ steps.planner.outputs.release_botplay }}
      botplay_extra: ${{ steps.planner.outputs.botplay_extra }}
      botplay_extra_images: ${{ steps.planner.outputs.botplay_extra_images }}
      images: ${{ steps.planner.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect non-doc changes
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
              - '!.github/workflows/cleanup-artifacts.yml'
            pins:
              - 'README.md'

      - name: Calculate execution plan and matrices
        id: planner
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_CHANGED: ${{ steps.filter.outputs.code || 'true' }}
          PINS_CHANGED: ${{ steps.filter.outputs.pins || 'false' }}
          INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 builder/scripts/ci_planner.py \
            --event-name "${EVENT_NAME}" \
            --code-changed "${CODE_CHANGED}" \
            --pins-changed "${PINS_CHANGED}" \
            --inputs-json "${INPUTS_JSON}" \
            --gha >> "$GITHUB_OUTPUT"

  check-pins:
    needs: plan
    if: needs.plan.outputs.run_check_pins == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version pin consistency
        run: python3 builder/lines.py check

      - name: Test pin generation
        run: python3 testing/scripts/test-lines.py

      - name: Windows zip layout self-test
        run: python3 builder/package_windows.py self-test

  hygiene:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install regression test tools and actionlint
        run: |
          sudo apt-get update && sudo apt-get install -y gcc binutils expect shellcheck
          curl -sL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C /tmp && sudo mv /tmp/actionlint /usr/local/bin/

      - name: Lint GitHub Action workflows
        run: actionlint

      - name: Test CI planner and gate logic
        run: python3 testing/scripts/test-ci-planner-gate.py

      - name: Check unversioned imports and PostgreSQL shim
        run: python3 testing/scripts/test-glibc-imports.py

      - name: Check console probe recovery
        run: python3 testing/scripts/test-console-probe.py

      - name: Check exact package selection
        run: bash testing/scripts/check-package-paths.sh

      - name: Check Metamod metadata and required packages
        run: python3 testing/scripts/test-check-metamod-package.py

      - name: Check release selection and Docker debug opt-in
        run: python3 testing/scripts/test-release-build-entrypoints.py

      - name: Check SM 1.11 DHooks generation
        run: python3 testing/scripts/test-sm11-dhooks-builder.py

      - name: Check patch drift acceptance ranges and failures
        timeout-minutes: 30
        run: python3 testing/scripts/test-check-patch-drift.py

      - name: Check the Metamod switch procedure
        run: python3 testing/scripts/test-switch-metamod.py

      - name: Check the SM 1.11 build log gate
        run: python3 testing/scripts/test-sm11-build-log.py

      - name: Check patch failures and generated Versioning
        run: python3 testing/scripts/test-patch-fail-closed.py

      - name: Intentionally fail smoke with a missing server
        id: negative-smoke
        continue-on-error: true
        shell: bash
        env:
          SERVER_DIR: ${{ runner.temp }}/absent-css34-server
        run: |
          mkdir -p "$SERVER_DIR"
          bash testing/scripts/smoke-test.sh 2>&1 | tee negative-smoke.log

      - name: Require the expected failure
        env:
          OUTCOME: ${{ steps.negative-smoke.outcome }}
        run: |
          test "$OUTCOME" = failure
          grep -q 'No srcds_i686/i486 binary found' negative-smoke.log

      - name: Preserve negative smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negative-smoke-logs
          path: negative-smoke.log
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Maybe skip non-selected lines
        id: select
        run: |
          want="${{ github.event.inputs.css34_line }}"
          if [[ -n "$want" && "$want" != "${{ matrix.line }}" ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SourceMod+Metamod (${{ matrix.line }}) pure-source
        if: steps.select.outputs.skip != '1'
        env:
          CSS34_LINE: ${{ matrix.line }}
          PURE_SOURCE_BUILD: "1"
        run: |
          chmod +x builder/docker/build.sh builder/run/linux.sh \
            builder/checkout-deps.sh builder/package.sh builder/package-metamod.sh \
            builder/build-metamod.sh builder/prepare-package.sh builder/write-build-stamps.sh \
            builder/resolve-version.sh builder/py.sh builder/patches/*.sh
          set -o pipefail
          builder/docker/build.sh 2>&1 | tee build.log

      - name: Dual-core build log gates (include roots, 0 WARN)
        if: steps.select.outputs.skip != '1' && matrix.secondary_mm_commit
        run: bash testing/scripts/check-sm11-build-log.sh build.log "${{ matrix.line }}"

      - name: ABI / export checks
        if: steps.select.outputs.skip != '1'
        run: |
          chmod +x testing/scripts/*.sh
          sudo apt-get update
          sudo apt-get install -y binutils
          CSS34_LINE="${{ matrix.line }}" source builder/package-paths.sh
          test -f "$SM_PACKAGE" && test -f "$MM_PACKAGE"
          export SM_PACKAGE MM_PACKAGE
          echo "Checking ${SM_PACKAGE}"
          testing/scripts/check-package.sh

          testing/scripts/verify-line-metamod-packages.sh "${{ matrix.line }}"

      - name: Cache packages for later jobs
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/save@v4
        with:
          path: packages
          key: css34-pkg-${{ github.run_id }}-${{ matrix.line }}

  build-windows:
    needs: plan
    if: needs.plan.outputs.run_windows == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC (x86, toolset 14.44, SDK 10.0.26100.0)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          toolset: "14.44"
          sdk: 10.0.26100.0

      - name: Build SourceMod + Metamod for CS:S v34 (${{ matrix.line }})
        shell: bash
        env:
          CSS34_LINE: ${{ matrix.line }}
          PURE_SOURCE_BUILD: "1"
        run: |
          export WDIR="$PWD"
          chmod +x builder/run/windows.sh builder/checkout-deps.sh builder/prepare-package.sh \
            builder/build-metamod.sh builder/write-build-stamps.sh builder/resolve-version.sh \
            builder/py.sh builder/patches/*.sh
          builder/run/windows.sh

      - name: Confirm Windows packages exist
        shell: bash
        run: |
          ls -lh packages/sourcemod-*-css34-windows.zip packages/mmsource-*-css34-windows.zip
          python builder/package_windows.py check \
            packages/sourcemod-*-css34-windows.zip \
            packages/mmsource-*-css34-windows.zip
          if command -v unzip >/dev/null 2>&1; then
            # One archive per call: unzip -l a.zip b.zip reads b.zip as a member name
            for z in packages/sourcemod-*-css34-windows.zip packages/mmsource-*-css34-windows.zip; do
              unzip -l "$z"
            done
          fi

      - name: Collect packages and PDBs
        shell: bash
        run: |
          mkdir -p win-art/pdb
          cp packages/sourcemod-*-css34-windows.zip packages/mmsource-*-css34-windows.zip win-art/
          find sourcemod/build deps -name '*.pdb' -path '*build*' -exec cp -f {} win-art/pdb/ \;
          ls -la win-art win-art/pdb

      - name: Cache packages for wine-smoke
        uses: actions/cache/save@v4
        with:
          path: win-art
          key: css34-win-${{ github.run_id }}-${{ matrix.line }}
          enableCrossOsArchive: true

      - name: Cache CS:S v34 server zips (Windows)
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/srcds_css34_4044.zip
            .ci-cache/srcds_css34_w_a.zip
          key: css34-win-server-zips-v1

      - name: Windows smoke test (${{ matrix.line }})
        shell: bash
        env:
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          MM_REV_EXPECT: ${{ matrix.mm_rev }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          EXPECT_EXTS: ${{ matrix.exts }}
          LOAD_EXTS: ${{ matrix.load_exts }}
          DHOOKS_EXPECT: ${{ matrix.dhooks_expect }}
          DHOOKS_PROBE_SECS: "150"
        run: |
          SM_WIN_PACKAGE="$(ls "$PWD"/win-art/sourcemod-*-css34-windows.zip)"
          # Native smoke runs on the line's primary Metamod build
          MM_WIN_PACKAGE="$PWD/win-art/${{ matrix.mm_package }}"
          PDB_DIR="$PWD/win-art/pdb"
          export SM_WIN_PACKAGE MM_WIN_PACKAGE PDB_DIR
          bash testing/scripts/wine-smoke-test.sh

      # PE check on the installed server: every sourcemod.<core>.dll reports its
      # PLAPI (1.ep1 = 11, 2.ep1 = 16) with the server's tier0/vstdlib on PATH.
      - name: PLAPI probe (Windows cores)
        shell: bash
        env:
          CSS34_LINE: ${{ matrix.line }}
        run: SERVER_DIR="$PWD/.ci-winserver" bash testing/scripts/check-core-plapi.sh

      - name: Upload Windows smoke logs and crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ matrix.line }}
          path: |
            .ci-winserver/cstrike/console.log
            .ci-winserver/cstrike/addons/sourcemod/logs/
            .ci-winserver/dumps/
          if-no-files-found: ignore
          retention-days: 7

  prepare-server:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached server tree
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-${{ github.event.inputs.apply_srcds_patch || '1' }}-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}

      - name: Install extract tools
        if: steps.server-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip unrar

      - name: Fetch CS:S v34 server
        if: steps.server-cache.outputs.cache-hit != 'true'
        env:
          SERVER_DIR: ${{ github.workspace }}/.ci-server
          CACHE_DIR: ${{ github.workspace }}/.ci-cache
          APPLY_SRCDS_PATCH: ${{ github.event.inputs.apply_srcds_patch || '1' }}
          APPLY_VALVE_RC: ${{ github.event.inputs.apply_srcds_patch || '1' }}
        run: |
          chmod +x testing/scripts/*.sh
          testing/scripts/fetch-server.sh
          if [[ "${APPLY_SRCDS_PATCH}" == "1" ]]; then
            testing/scripts/apply-valve-rc-fix.sh
            testing/scripts/apply-srcds-patch.sh
          fi
          KEEP_MAPS=de_dust2,de_inferno,de_nuke testing/scripts/trim-server-maps.sh

      - name: Pack server tree
        if: steps.server-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p server-art
          tar -C .ci-server -czf server-art/css34-server.tar.gz .
          ls -lh server-art/css34-server.tar.gz

      - name: Save server tree cache
        if: steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: server-art/css34-server.tar.gz
          key: ${{ steps.server-cache.outputs.cache-primary-key }}

  wine-smoke:
    needs: [plan, build-windows, prepare-server]
    if: needs.plan.outputs.run_windows == 'true' && !cancelled()
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        # One row per Metamod build: dual-core SM 1.11 runs on MM 1.10.7 and MM 1.12
        include: ${{ fromJSON(needs.plan.outputs.windows_smoke) }}
    steps:
      - name: Install Wine
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            wine32 wine xvfb unzip curl ca-certificates python3 binutils llvm-14 git zstd
          ln -sf /usr/bin/llvm-symbolizer-14 /usr/local/bin/llvm-symbolizer

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Windows packages
        uses: actions/cache/restore@v4
        with:
          path: win-art
          key: css34-win-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      - name: Restore server tree
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-${{ github.event.inputs.apply_srcds_patch || '1' }}-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}
          fail-on-cache-miss: true

      - name: Wine smoke test (${{ matrix.line }}, MM ${{ matrix.mm_expect }})
        shell: bash
        env:
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          MM_REV_EXPECT: ${{ matrix.mm_rev }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          EXPECT_EXTS: ${{ matrix.exts }}
          LOAD_EXTS: ${{ matrix.load_exts }}
          DHOOKS_EXPECT: ${{ matrix.dhooks_expect }}
          DHOOKS_PROBE_SECS: "150"
        run: |
          SM_WIN_PACKAGE="$(ls win-art/sourcemod-*-css34-windows.zip)"
          MM_WIN_PACKAGE="win-art/${{ matrix.mm_package }}"
          PDB_DIR="$PWD/win-art/pdb"
          export SM_WIN_PACKAGE MM_WIN_PACKAGE PDB_DIR
          [[ -f server-art/css34-server.tar.gz ]] && export SERVER_TGZ="$PWD/server-art/css34-server.tar.gz"
          echo "==== unzip -l ${SM_WIN_PACKAGE} ===="
          unzip -l "${SM_WIN_PACKAGE}"
          echo "==== unzip -l ${MM_WIN_PACKAGE} ===="
          unzip -l "${MM_WIN_PACKAGE}"
          python3 builder/package_windows.py check "${SM_WIN_PACKAGE}" "${MM_WIN_PACKAGE}"
          bash testing/scripts/wine-smoke-test.sh

  test-built-debian:
    needs: [plan, build-linux, prepare-server]
    if: needs.plan.outputs.run_pr_smoke == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.debian) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maybe skip
        id: select
        run: |
          want="${{ github.event.inputs.css34_line }}"
          if [[ -n "$want" && "$want" != "${{ matrix.line }}" ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore packages from cache
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: css34-pkg-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true

      - name: Restore cached server tree
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-${{ github.event.inputs.apply_srcds_patch || '1' }}-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}
          fail-on-cache-miss: true

      - name: Smoke test ${{ matrix.line }} (${{ matrix.mm_variant }} Metamod) in ${{ matrix.image_name }}
        if: steps.select.outputs.skip != '1'
        env:
          IMAGE: ${{ matrix.image }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          MM_REV_EXPECT: ${{ matrix.mm_rev }}
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          SM_COMMIT_EXPECT: ${{ matrix.sm_commit }}
          SMOKE_EXPECT_CORE: ${{ matrix.expect_core }}
          MM_PACKAGE_NAME: ${{ matrix.mm_package }}
          SWITCH_FROM_PACKAGE: ${{ matrix.switch_from_package }}
          CSS34_PACK_COMMIT_EXPECT: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x testing/scripts/*.sh
          CSS34_LINE="${{ matrix.line }}" source builder/package-paths.sh
          # The matrix row names the Metamod build this job runs (primary,
          # secondary, or a switch from one to the other).
          MM_PACKAGE="packages/${MM_PACKAGE_NAME}"
          test -f "$SM_PACKAGE" && test -f "$MM_PACKAGE"
          switch_from=""
          if [[ -n "${SWITCH_FROM_PACKAGE}" ]]; then
            switch_from="/workspace/packages/${SWITCH_FROM_PACKAGE}"
            test -f "packages/${SWITCH_FROM_PACKAGE}"
          fi
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -e SERVER_DIR=/workspace/.ci-server \
            -e CACHE_DIR=/workspace/.ci-cache \
            -e SM_PACKAGE="/workspace/${SM_PACKAGE}" \
            -e MM_PACKAGE="/workspace/${MM_PACKAGE}" \
            -e MM_SWITCH_FROM="${switch_from}" \
            -e MM_VERSION_EXPECT \
            -e MM_REV_EXPECT \
            -e SM_VERSION_EXPECT \
            -e MM_COMMIT_EXPECT \
            -e SM_COMMIT_EXPECT \
            -e SMOKE_EXPECT_CORE \
            -e CSS34_PACK_COMMIT_EXPECT \
            -e CSS34_LINE="${{ matrix.line }}" \
            -e TIMEOUT_SECS=120 \
            -e SMOKE_CONDEBUG=1 \
            -e SMOKE_VERBOSE=1 \
            -e CSS34_CI=1 \
            -w /workspace \
            "${IMAGE}" \
            bash -lc '
              set -euo pipefail
              mkdir -p /workspace/.ci-server /workspace/.ci-cache
              tar -xzf /workspace/server-art/css34-server.tar.gz -C /workspace/.ci-server
              testing/scripts/install-deps.sh
              if [[ -n "${MM_SWITCH_FROM}" ]]; then
                MM_PACKAGE="${MM_SWITCH_FROM}" testing/scripts/install-addons.sh
                testing/scripts/switch-metamod.sh "${MM_PACKAGE}"
              else
                testing/scripts/install-addons.sh
              fi
              testing/scripts/smoke-test.sh
            '

      - name: Upload smoke logs on failure
        if: failure() && steps.select.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: built-debian-smoke-logs-${{ matrix.line }}-${{ strategy.job-index }}
          path: |
            .ci-server/smoke.log
            .ci-server/console-probe.log
            .ci-server/cstrike/console.log
            .ci-server/cstrike/addons/metamod/bin/metamod-fatal.log
            .ci-server/addons/metamod/bin/metamod-fatal.log
            .ci-server/metamod-fatal.log
            .ci-server/cstrike/metamod-fatal.log
            .ci-server/cstrike/addons/sourcemod/logs/L*.log
          if-no-files-found: ignore
          retention-days: 7

  test-built-botplay-matrix:
    needs: [plan, build-linux, prepare-server]
    if: needs.plan.outputs.run_pr_smoke == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_full_botplay_matrix == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.botplay) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maybe skip
        id: select
        run: |
          want="${{ github.event.inputs.css34_line }}"
          if [[ -n "$want" && "$want" != "${{ matrix.line }}" ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore packages from cache
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
