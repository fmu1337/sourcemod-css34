        run: |
          want="${{ github.event.inputs.css34_line }}"
          if [[ -n "$want" && "$want" != "${{ matrix.line }}" ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore packages from cache
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: css34-pkg-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true

      - name: Restore cached server tree
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-${{ github.event.inputs.apply_srcds_patch || '1' }}-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}
          fail-on-cache-miss: true

      - name: Smoke test ${{ matrix.line }} (${{ matrix.mm_variant }} Metamod) in ${{ matrix.image_name }}
        if: steps.select.outputs.skip != '1'
        env:
          IMAGE: ${{ matrix.image }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          MM_REV_EXPECT: ${{ matrix.mm_rev }}
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          SM_COMMIT_EXPECT: ${{ matrix.sm_commit }}
          SMOKE_EXPECT_CORE: ${{ matrix.expect_core }}
          MM_PACKAGE_NAME: ${{ matrix.mm_package }}
          SWITCH_FROM_PACKAGE: ${{ matrix.switch_from_package }}
          CSS34_PACK_COMMIT_EXPECT: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x testing/scripts/*.sh
          CSS34_LINE="${{ matrix.line }}" source builder/package-paths.sh
          # The matrix row names the Metamod build this job runs (primary,
          # secondary, or a switch from one to the other).
          MM_PACKAGE="packages/${MM_PACKAGE_NAME}"
          test -f "$SM_PACKAGE" && test -f "$MM_PACKAGE"
          switch_from=""
          if [[ -n "${SWITCH_FROM_PACKAGE}" ]]; then
            switch_from="/workspace/packages/${SWITCH_FROM_PACKAGE}"
            test -f "packages/${SWITCH_FROM_PACKAGE}"
          fi
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -e SERVER_DIR=/workspace/.ci-server \
            -e CACHE_DIR=/workspace/.ci-cache \
            -e SM_PACKAGE="/workspace/${SM_PACKAGE}" \
            -e MM_PACKAGE="/workspace/${MM_PACKAGE}" \
            -e MM_SWITCH_FROM="${switch_from}" \
            -e MM_VERSION_EXPECT \
            -e MM_REV_EXPECT \
            -e SM_VERSION_EXPECT \
            -e MM_COMMIT_EXPECT \
            -e SM_COMMIT_EXPECT \
            -e SMOKE_EXPECT_CORE \
            -e CSS34_PACK_COMMIT_EXPECT \
            -e CSS34_LINE="${{ matrix.line }}" \
            -e TIMEOUT_SECS=120 \
            -e SMOKE_CONDEBUG=1 \
            -e SMOKE_VERBOSE=1 \
            -e CSS34_CI=1 \
            -w /workspace \
            "${IMAGE}" \
            bash -lc '
              set -euo pipefail
              mkdir -p /workspace/.ci-server /workspace/.ci-cache
              tar -xzf /workspace/server-art/css34-server.tar.gz -C /workspace/.ci-server
              testing/scripts/install-deps.sh
              if [[ -n "${MM_SWITCH_FROM}" ]]; then
                MM_PACKAGE="${MM_SWITCH_FROM}" testing/scripts/install-addons.sh
                testing/scripts/switch-metamod.sh "${MM_PACKAGE}"
              else
                testing/scripts/install-addons.sh
              fi
              testing/scripts/smoke-test.sh
            '

      - name: Upload smoke logs on failure
        if: failure() && steps.select.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: built-weekly-smoke-logs-${{ matrix.line }}-${{ strategy.job-index }}
          path: |
            .ci-server/smoke.log
            .ci-server/console-probe.log
            .ci-server/cstrike/console.log
            .ci-server/cstrike/addons/metamod/bin/metamod-fatal.log
            .ci-server/addons/metamod/bin/metamod-fatal.log
            .ci-server/metamod-fatal.log
            .ci-server/cstrike/metamod-fatal.log
            .ci-server/cstrike/addons/sourcemod/logs/L*.log
          if-no-files-found: ignore
          retention-days: 7

  test-built-weekly-botplay:
    needs: [plan, build-linux, prepare-server]
    if: needs.plan.outputs.run_weekly_smoke == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.weekly_botplay) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maybe skip
        id: select
        run: |
          want="${{ github.event.inputs.css34_line }}"
          if [[ -n "$want" && "$want" != "${{ matrix.line }}" ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore packages from cache
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: css34-pkg-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true

      - name: Restore cached server tree
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-${{ github.event.inputs.apply_srcds_patch || '1' }}-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}
          fail-on-cache-miss: true

      - name: Botplay stress ${{ matrix.line }} on ${{ matrix.image_name }}
        if: steps.select.outputs.skip != '1'
        env:
          IMAGE: ${{ matrix.image }}
          RECORD_SECS: ${{ github.event.inputs.record_secs || '300' }}
          BOTPLAY_PROFILE: built
          BOTPLAY_CFG: botplay-stress.cfg
          BOTPLAY_MAPS: de_dust2,de_inferno,de_nuke
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
        run: |
          set -euo pipefail
          chmod +x testing/scripts/*.sh
          CSS34_LINE="${{ matrix.line }}" source builder/package-paths.sh
          test -f "$SM_PACKAGE" && test -f "$MM_PACKAGE"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -e SERVER_DIR=/workspace/.ci-server \
            -e CACHE_DIR=/workspace/.ci-cache \
            -e RECORD_SECS \
            -e BOTPLAY_PROFILE \
            -e BOTPLAY_CFG \
            -e BOTPLAY_MAPS \
            -e MM_VERSION_EXPECT \
            -e SM_VERSION_EXPECT \
            -e SM_PACKAGE="/workspace/${SM_PACKAGE}" \
            -e MM_PACKAGE="/workspace/${MM_PACKAGE}" \
            -e REPORT_JSON=/workspace/.ci-server/botplay-report.json \
            -e REPORT_TXT=/workspace/.ci-server/botplay-report.txt \
            -e SMOKE_CONDEBUG=1 \
            -e SMOKE_VERBOSE=1 \
            -e CSS34_CI=1 \
            -w /workspace \
            "${IMAGE}" \
            bash -lc '
              set -euo pipefail
              mkdir -p /workspace/.ci-server /workspace/.ci-cache
              tar -xzf /workspace/server-art/css34-server.tar.gz -C /workspace/.ci-server
              testing/scripts/install-deps.sh
              testing/scripts/botplay-test.sh
            '

      - name: Upload botplay report on failure
        if: failure() && steps.select.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-botplay-${{ matrix.line }}-logs
          path: |
            .ci-server/botplay-report.json
            .ci-server/botplay-report.txt
            .ci-server/botplay.log
            .ci-server/botplay-run.log
            .ci-server/cstrike/console.log
            .ci-server/cstrike/addons/sourcemod/logs/L*.log
          if-no-files-found: ignore
          retention-days: 7

  plapi-runtime:
    needs: [plan, build-linux, prepare-server]
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - name: Select requested line
        id: select
        env:
          WANT: ${{ github.event.inputs.css34_line }}
          LINE: ${{ matrix.line }}
        run: |
          if [[ -n "$WANT" && "$WANT" != "$LINE" ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore packages
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: css34-pkg-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true
      - name: Restore server providers
        if: steps.select.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: server-art/css34-server.tar.gz
          key: css34-server-v1-${{ github.event.inputs.apply_srcds_patch || '1' }}-${{ hashFiles('testing/scripts/fetch-server.sh', 'testing/scripts/apply-valve-rc-fix.sh', 'testing/scripts/apply-srcds-patch.sh', 'testing/scripts/trim-server-maps.sh') }}
          fail-on-cache-miss: true
      - name: Check actual core PLAPI
        if: steps.select.outputs.skip != '1'
        env:
          CSS34_LINE: ${{ matrix.line }}
          SERVER_DIR: ${{ github.workspace }}/.ci-plapi-server
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-multilib lib32stdc++6 lib32z1
          source builder/package-paths.sh
          export SM_PACKAGE MM_PACKAGE
          mkdir -p "$SERVER_DIR"
          tar -xzf server-art/css34-server.tar.gz -C "$SERVER_DIR"
          bash testing/scripts/install-addons.sh
          bash testing/scripts/check-core-plapi.sh

      - name: Published pre-T2.3 dual package must fail the PLAPI probe
        if: steps.select.outputs.skip != '1' && matrix.secondary_mm_commit
        env:
          CSS34_LINE: ${{ matrix.line }}
          SERVER_DIR: ${{ github.workspace }}/.ci-plapi-old
          OLD_SM_URL: https://github.com/${{ github.repository }}/releases/download/1.11.0.6970-mm1.10.7/sourcemod-1.11.0-git6970-css34-linux.tar.gz
        run: |
          set -euo pipefail
          source builder/package-paths.sh
          mkdir -p "$SERVER_DIR" old-release
          curl -fsSL --retry 5 -o old-release/sourcemod-old.tar.gz "$OLD_SM_URL"
          tar -xzf server-art/css34-server.tar.gz -C "$SERVER_DIR"
          SM_PACKAGE="$PWD/old-release/sourcemod-old.tar.gz" MM_PACKAGE="$MM_PACKAGE" \
            bash testing/scripts/install-addons.sh
          if bash testing/scripts/check-core-plapi.sh > old-plapi.log 2>&1; then
            cat old-plapi.log
            echo "FAIL: the published 1.11.0.6970-mm1.10.7 package passed the PLAPI gate" >&2
            exit 1
          fi
          cat old-plapi.log
          grep -q 'sourcemod.2.ep1.so returned PLAPI:11, expected PLAPI:16' old-plapi.log

  gate:
    name: gate
    if: always()
    needs:
      - plan
      - check-pins
      - hygiene
      - build-linux
      - build-windows
      - wine-smoke
      - prepare-server
      - test-built-debian
      - plapi-runtime
      - test-built-botplay-matrix
      - test-built-smoke
      - test-built-weekly
      - test-built-weekly-botplay
      - test-rom4s-botplay
      - test-rom4s-botplay-extra
      - test-built-botplay-extra
      - test-release-botplay
      - test-botplay-bisect
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate Unified Gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
        run: |
          python3 builder/scripts/ci_gate.py \
            --needs-json "${NEEDS_JSON}" \
            --plan-json "${REQUIRED_JOBS}"
