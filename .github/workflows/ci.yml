name: CI

permissions:
  contents: read
  actions: read
  pull-requests: read

# plan (builder/scripts/ci_planner.py) picks the suite, the matrices and the
# jobs the run requires; gate (builder/scripts/ci_gate.py) is the one check
# that must pass.
#   pr     (PRs, master pushes, dispatch suite=pr): smoke on centos:7 /
#          ubuntu:24.04 / debian:13, botplay on debian:11, native Windows smoke
#   weekly (Monday schedule, dispatch suite=weekly): smoke on the old OS images,
#          botplay on centos:7, native Windows smoke and the Wine smoke
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      suite:
        description: "pr = centos:7 + ubuntu:24.04 + debian:13 smoke, debian:11 botplay; weekly = old OS smoke, centos:7 botplay, Wine smoke"
        type: choice
        options:
          - pr
          - weekly
        required: false
        default: pr
      css34_line:
        description: "Optional single CSS34_LINE (an active line: sm12-latest|sm13-latest; frozen sm11-oldstable is refused); empty = every active line"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      run_code_jobs: ${{ steps.planner.outputs.run_code_jobs }}
      run_check_pins: ${{ steps.planner.outputs.run_check_pins }}
      run_windows: ${{ steps.planner.outputs.run_windows }}
      run_wine: ${{ steps.planner.outputs.run_wine }}
      suite: ${{ steps.planner.outputs.suite }}
      required_jobs: ${{ steps.planner.outputs.required_jobs }}
      build: ${{ steps.planner.outputs.build }}
      smoke: ${{ steps.planner.outputs.smoke }}
      botplay: ${{ steps.planner.outputs.botplay }}
      windows: ${{ steps.planner.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect non-doc changes
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
            pins:
              - 'README.md'

      - name: Calculate execution plan and matrices
        id: planner
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_CHANGED: ${{ steps.filter.outputs.code || 'true' }}
          PINS_CHANGED: ${{ steps.filter.outputs.pins || 'false' }}
          INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 builder/scripts/ci_planner.py \
            --event-name "${EVENT_NAME}" \
            --code-changed "${CODE_CHANGED}" \
            --pins-changed "${PINS_CHANGED}" \
            --inputs-json "${INPUTS_JSON}" \
            --gha >> "$GITHUB_OUTPUT"

  check-pins:
    needs: plan
    if: needs.plan.outputs.run_check_pins == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify version pin consistency
        run: python3 builder/lines.py check

      - name: Test pin generation
        run: python3 testing/scripts/test-lines.py

      - name: Release tag map and release notes for every releasable tag
        run: bash builder/scripts/check-tag-map.sh

      - name: Windows zip layout self-test
        run: python3 builder/package_windows.py self-test

  hygiene:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install regression test tools and actionlint
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc binutils expect shellcheck
          # Pinned version, sha256-checked
          bash testing/scripts/install-actionlint.sh

      - name: Lint GitHub Action workflows
        run: actionlint

      # Every testing/scripts/test-*.py and test-*.sh, then the negative smoke
      # check (smoke-test.sh must fail without a server); summary in the job summary.
      - name: Host regression tests
        timeout-minutes: 30
        run: bash testing/scripts/run-host-tests.sh

  build-linux:
    name: build-linux (${{ matrix.line }})
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and check packages
        uses: ./.github/actions/build-linux
        with:
          line: ${{ matrix.line }}

      - name: Cache packages for later jobs
        uses: actions/cache/save@v6
        with:
          path: packages
          key: css34-pkg-${{ github.run_id }}-${{ matrix.line }}

  build-windows:
    name: build-windows (${{ matrix.line }})
    needs: plan
    if: needs.plan.outputs.run_windows == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and check packages
        uses: ./.github/actions/build-windows
        with:
          line: ${{ matrix.line }}

      - name: Collect packages and PDBs
        shell: bash
        run: |
          mkdir -p win-art/pdb
          cp packages/sourcemod-*-css34-windows.zip packages/mmsource-*-css34-windows.zip win-art/
          # T2.9: the PLAPI 11 test plugin for the legacy-plugin bridge (never released)
          if [[ -d packages/test-plugins ]]; then cp -r packages/test-plugins win-art/; fi
          find sourcemod/build deps -name '*.pdb' -path '*build*' -exec cp -f {} win-art/pdb/ \;
          ls -la win-art win-art/pdb

      - name: Cache packages for wine-smoke
        if: needs.plan.outputs.run_wine == 'true'
        uses: actions/cache/save@v6
        with:
          path: win-art
          key: css34-win-${{ github.run_id }}-${{ matrix.line }}
          enableCrossOsArchive: true

      - name: Cache CS:S v34 server zips (Windows)
        uses: actions/cache@v6
        with:
          path: |
            .ci-cache/srcds_css34_4044.zip
            .ci-cache/srcds_css34_w_a.zip
          key: css34-win-server-zips-v1

      - name: Windows smoke test (${{ matrix.line }})
        shell: bash
        env:
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          MM_REV_EXPECT: ${{ matrix.mm_rev }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          EXPECT_EXTS: ${{ matrix.exts }}
          LOAD_EXTS: ${{ matrix.load_exts }}
          DHOOKS_EXPECT: ${{ matrix.dhooks_expect }}
          DHOOKS_PROBE_SECS: "150"
          LEGACY_BRIDGE: ${{ matrix.legacy_bridge }}
        run: |
          set -euo pipefail
          SM_WIN_PACKAGE="$(ls "$PWD"/win-art/sourcemod-*-css34-windows.zip)"
          # Native smoke runs on the line's primary Metamod build
          MM_WIN_PACKAGE="$PWD/win-art/${{ matrix.mm_package }}"
          PDB_DIR="$PWD/win-art/pdb"
          # T2.9: a PLAPI 11 plugin must run on metamod.2.ep1 through the nested
          # metamod.1.ep1 legacy core of the MM 1.12 zip.
          LEGACY_PROBE=""
          if [[ "${LEGACY_BRIDGE}" == 1 ]]; then
            LEGACY_PROBE="$PWD/win-art/test-plugins/css34_legacy_probe.dll"
          fi
          export SM_WIN_PACKAGE MM_WIN_PACKAGE PDB_DIR LEGACY_PROBE
          bash testing/scripts/wine-smoke-test.sh

      # PE check on the installed server: every sourcemod.<core>.dll reports its
      # PLAPI (1.ep1 = 11, 2.ep1 = 16) with the server's tier0/vstdlib on PATH.
      - name: PLAPI probe (Windows cores)
        shell: bash
        env:
          CSS34_LINE: ${{ matrix.line }}
        run: SERVER_DIR="$PWD/.ci-winserver" bash testing/scripts/check-core-plapi.sh

      - name: Upload Windows smoke logs and crash dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-${{ matrix.line }}
          path: |
            .ci-winserver/cstrike/console.log
            .ci-winserver/cstrike/addons/sourcemod/logs/
            .ci-winserver/dumps/
          if-no-files-found: ignore
          retention-days: 7

  prepare-server:
    needs: plan
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    outputs:
      server_key: ${{ steps.server.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore or prepare the server tree
        id: server
        uses: ./.github/actions/server-tree
        with:
          save: "true"

  # Weekly only: the same Windows zips under Wine on Linux (native Windows
  # smoke in build-windows is the per-PR gate).
  wine-smoke:
    name: wine-smoke (${{ matrix.line }})
    needs: [plan, build-windows, prepare-server]
    if: needs.plan.outputs.run_wine == 'true' && !cancelled()
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - name: Install Wine
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            wine32 wine xvfb unzip curl ca-certificates python3 binutils llvm-14 git zstd
          ln -sf /usr/bin/llvm-symbolizer-14 /usr/local/bin/llvm-symbolizer

      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Windows packages
        uses: actions/cache/restore@v6
        with:
          path: win-art
          key: css34-win-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      - name: Restore server tree
        uses: actions/cache/restore@v6
        with:
          path: server-art/css34-server.tar.gz
          key: ${{ needs.prepare-server.outputs.server_key }}
          fail-on-cache-miss: true

      - name: Wine smoke test (${{ matrix.line }}, MM ${{ matrix.mm_expect }})
        shell: bash
        env:
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          MM_REV_EXPECT: ${{ matrix.mm_rev }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          EXPECT_EXTS: ${{ matrix.exts }}
          LOAD_EXTS: ${{ matrix.load_exts }}
          DHOOKS_EXPECT: ${{ matrix.dhooks_expect }}
          DHOOKS_PROBE_SECS: "150"
          LEGACY_BRIDGE: ${{ matrix.legacy_bridge }}
        run: |
          set -euo pipefail
          SM_WIN_PACKAGE="$(ls win-art/sourcemod-*-css34-windows.zip)"
          MM_WIN_PACKAGE="win-art/${{ matrix.mm_package }}"
          LEGACY_PROBE=""
          if [[ "${LEGACY_BRIDGE}" == 1 ]]; then
            LEGACY_PROBE="$PWD/win-art/test-plugins/css34_legacy_probe.dll"
          fi
          PDB_DIR="$PWD/win-art/pdb"
          SERVER_TGZ="$PWD/server-art/css34-server.tar.gz"
          export SM_WIN_PACKAGE MM_WIN_PACKAGE LEGACY_PROBE PDB_DIR SERVER_TGZ
          python3 builder/package_windows.py check "${SM_WIN_PACKAGE}" "${MM_WIN_PACKAGE}"
          bash testing/scripts/wine-smoke-test.sh

      - name: Upload Wine smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wine-smoke-${{ matrix.line }}
          path: |
            .ci-winserver/wine.log
            .ci-winserver/cstrike/console.log
            .ci-winserver/cstrike/addons/sourcemod/logs/
          if-no-files-found: ignore
          retention-days: 7

  # Built packages in pinned containers: install-deps.sh, install-addons.sh,
  # smoke-test.sh, the legacy-plugin bridge probe and the MySQL TLS probe.
  smoke:
    name: smoke (${{ matrix.line }}, ${{ matrix.image_name }})
    needs: [plan, build-linux, prepare-server]
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore packages from cache
        uses: actions/cache/restore@v6
        with:
          path: packages
          key: css34-pkg-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true

      - name: Restore cached server tree
        uses: actions/cache/restore@v6
        with:
          path: server-art/css34-server.tar.gz
          key: ${{ needs.prepare-server.outputs.server_key }}
          fail-on-cache-miss: true

      - name: Start MariaDB and MySQL 8.4 with TLS for the MySQL probe (T4.5)
        run: bash testing/scripts/mysql-tls-server.sh start .ci-mysql-tls

      - name: Smoke test ${{ matrix.line }} in ${{ matrix.image_name }}
        env:
          IMAGE: ${{ matrix.image }}
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          MM_REV_EXPECT: ${{ matrix.mm_rev }}
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          SM_COMMIT_EXPECT: ${{ matrix.sm_commit }}
          SMOKE_EXPECT_CORE: ${{ matrix.expect_core }}
          MM_PACKAGE_NAME: ${{ matrix.mm_package }}
          LEGACY_BRIDGE: ${{ matrix.legacy_bridge }}
          CSS34_PACK_COMMIT_EXPECT: ${{ github.sha }}
        run: |
          set -euo pipefail
          CSS34_LINE="${{ matrix.line }}" source builder/package-paths.sh
          MM_PACKAGE="packages/${MM_PACKAGE_NAME}"
          test -f "$SM_PACKAGE" && test -f "$MM_PACKAGE"
          # T2.9: a PLAPI 11 plugin must run through the nested legacy core that
          # the MM 1.12 package ships next to metamod.2.ep1.
          legacy_probe=""
          if [[ "${LEGACY_BRIDGE}" == 1 ]]; then
            legacy_probe="/workspace/packages/test-plugins/css34_legacy_probe.so"
            test -f "packages/test-plugins/css34_legacy_probe.so"
          fi
          docker run --rm --platform linux/amd64 \
            --network css34-db \
            -v "$PWD:/workspace" \
            -e SERVER_DIR=/workspace/.ci-server \
            -e CACHE_DIR=/workspace/.ci-cache \
            -e SM_PACKAGE="/workspace/${SM_PACKAGE}" \
            -e MM_PACKAGE="/workspace/${MM_PACKAGE}" \
            -e LEGACY_PROBE="${legacy_probe}" \
            -e MYSQL_TLS_CERTS=/workspace/.ci-mysql-tls \
            -e MYSQL_TLS_PROBE=/workspace/packages/test-plugins/css34_mysql_tls_probe \
            -e MM_VERSION_EXPECT \
            -e MM_REV_EXPECT \
            -e SM_VERSION_EXPECT \
            -e MM_COMMIT_EXPECT \
            -e SM_COMMIT_EXPECT \
            -e SMOKE_EXPECT_CORE \
            -e CSS34_PACK_COMMIT_EXPECT \
            -e CSS34_LINE="${{ matrix.line }}" \
            -e TIMEOUT_SECS=120 \
            -e SMOKE_CONDEBUG=1 \
            -e SMOKE_VERBOSE=1 \
            -e CSS34_CI=1 \
            -w /workspace \
            "${IMAGE}" \
            bash -lc '
              set -euo pipefail
              mkdir -p /workspace/.ci-server /workspace/.ci-cache
              tar -xzf /workspace/server-art/css34-server.tar.gz -C /workspace/.ci-server
              testing/scripts/install-deps.sh
              testing/scripts/install-addons.sh
              testing/scripts/smoke-test.sh
              if [[ -n "${LEGACY_PROBE}" ]]; then
                testing/scripts/legacy-bridge-test.sh
              fi
              # T4.5: TLS through the static OpenSSL of dbi.mysql.ext (skipped
              # when the extension links none) and ssl_mode / ssl_ca from srcds.
              testing/scripts/mysql-tls-test.sh
            '

      - name: Stop MariaDB and MySQL
        if: always()
        run: bash testing/scripts/mysql-tls-server.sh stop

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.line }}-${{ strategy.job-index }}
          path: |
            .ci-server/smoke.log
            .ci-server/mysql-tls.log*
            .ci-server/legacy-bridge.log*
            .ci-server/console-probe.log
            .ci-server/cstrike/console.log
            .ci-server/cstrike/addons/metamod/bin/metamod-fatal.log
            .ci-server/addons/metamod/bin/metamod-fatal.log
            .ci-server/metamod-fatal.log
            .ci-server/cstrike/metamod-fatal.log
            .ci-server/cstrike/addons/sourcemod/logs/L*.log
          if-no-files-found: ignore
          retention-days: 7

  # botplay-stress.cfg with bots on three maps: SDKTools, SDKHooks, OnTakeDamage,
  # DHooks and the gamedata probe on the built packages.
  botplay:
    name: botplay (${{ matrix.line }}, ${{ matrix.image_name }})
    needs: [plan, build-linux, prepare-server]
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.botplay) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore packages from cache
        uses: actions/cache/restore@v6
        with:
          path: packages
          key: css34-pkg-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true

      - name: Restore cached server tree
        uses: actions/cache/restore@v6
        with:
          path: server-art/css34-server.tar.gz
          key: ${{ needs.prepare-server.outputs.server_key }}
          fail-on-cache-miss: true

      - name: Botplay stress ${{ matrix.line }} on ${{ matrix.image_name }}
        env:
          IMAGE: ${{ matrix.image }}
          RECORD_SECS: "300"
          BOTPLAY_PROFILE: built
          BOTPLAY_CFG: botplay-stress.cfg
          BOTPLAY_MAPS: de_dust2,de_inferno,de_nuke
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          BOTPLAY_EXPECT_DHOOKS: ${{ matrix.dhooks_expect }}
          MM_PACKAGE_NAME: ${{ matrix.mm_package }}
        run: |
          set -euo pipefail
          CSS34_LINE="${{ matrix.line }}" source builder/package-paths.sh
          MM_PACKAGE="packages/${MM_PACKAGE_NAME}"
          test -f "$SM_PACKAGE" && test -f "$MM_PACKAGE"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -e SERVER_DIR=/workspace/.ci-server \
            -e CACHE_DIR=/workspace/.ci-cache \
            -e RECORD_SECS \
            -e BOTPLAY_PROFILE \
            -e BOTPLAY_CFG \
            -e BOTPLAY_MAPS \
            -e MM_VERSION_EXPECT \
            -e SM_VERSION_EXPECT \
            -e BOTPLAY_EXPECT_DHOOKS \
            -e SM_PACKAGE="/workspace/${SM_PACKAGE}" \
            -e MM_PACKAGE="/workspace/${MM_PACKAGE}" \
            -e REPORT_JSON=/workspace/.ci-server/botplay-report.json \
            -e REPORT_TXT=/workspace/.ci-server/botplay-report.txt \
            -e SMOKE_CONDEBUG=1 \
            -e SMOKE_VERBOSE=1 \
            -e CSS34_CI=1 \
            -w /workspace \
            "${IMAGE}" \
            bash -lc '
              set -euo pipefail
              mkdir -p /workspace/.ci-server /workspace/.ci-cache
              tar -xzf /workspace/server-art/css34-server.tar.gz -C /workspace/.ci-server
              testing/scripts/install-deps.sh
              testing/scripts/botplay-test.sh
            '

      # Informational: the counters next to the rom4s 6572 baseline, in the job
      # summary. The botplay step above is the gate.
      - name: Compare botplay vs rom4s baseline
        if: always()
        env:
          LINE: ${{ matrix.line }}
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          report=.ci-server/botplay-report.json
          out=.ci-server/botplay-compare.txt
          {
            echo "### Botplay ${LINE} on ${IMAGE_NAME} vs rom4s baseline"
            echo
            if [[ -f "$report" ]]; then
              rc=0
              bash testing/scripts/compare-botplay-reports.sh \
                testing/botplay/rom4s-baseline.json "$report" "$out" >/dev/null 2>&1 || rc=$?
              echo '```'
              cat "$out" 2>/dev/null || echo "(no comparison output, exit ${rc})"
              echo '```'
              [[ "$rc" == 0 ]] || echo "Below the baseline in at least one counter (exit ${rc})."
            else
              echo "No botplay-report.json (the botplay step failed before writing it)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload botplay report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: botplay-logs-${{ matrix.line }}-${{ strategy.job-index }}
          path: |
            .ci-server/botplay-report.json
            .ci-server/botplay-report.txt
            .ci-server/botplay-compare.txt
            .ci-server/botplay.log
            .ci-server/botplay-run.log
            .ci-server/cstrike/console.log
            .ci-server/cstrike/addons/sourcemod/logs/L*.log
          if-no-files-found: ignore
          retention-days: 7

  # On the runner itself (Ubuntu 22.04, no container): install the packages,
  # check every core's PLAPI against the real server providers, smoke test.
  host-checks:
    name: host-checks (${{ matrix.line }})
    needs: [plan, build-linux, prepare-server]
    if: needs.plan.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    env:
      CSS34_LINE: ${{ matrix.line }}
      SERVER_DIR: ${{ github.workspace }}/.ci-server
      CACHE_DIR: ${{ github.workspace }}/.ci-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore packages from cache
        uses: actions/cache/restore@v6
        with:
          path: packages
          key: css34-pkg-${{ github.run_id }}-${{ matrix.line }}
          fail-on-cache-miss: true

      - name: Restore cached server tree
        uses: actions/cache/restore@v6
        with:
          path: server-art/css34-server.tar.gz
          key: ${{ needs.prepare-server.outputs.server_key }}
          fail-on-cache-miss: true

      - name: Install host 32-bit runtime and compiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y expect gcc-multilib lib32gcc-s1 lib32stdc++6 lib32z1 \
            libc6-i386 libstdc++6:i386 zlib1g:i386

      - name: Install the packages into the server tree
        run: |
          set -euo pipefail
          mkdir -p "$SERVER_DIR" "$CACHE_DIR"
          tar -xzf server-art/css34-server.tar.gz -C "$SERVER_DIR"
          source builder/package-paths.sh
          test -f "$SM_PACKAGE" && test -f "$MM_PACKAGE"
          testing/scripts/install-addons.sh

      - name: Check actual core PLAPI
        run: bash testing/scripts/check-core-plapi.sh

      - name: Smoke test built Metamod + built SourceMod (${{ matrix.line }})
        env:
          MM_VERSION_EXPECT: ${{ matrix.mm_expect }}
          SM_VERSION_EXPECT: ${{ matrix.sm_expect }}
          MM_COMMIT_EXPECT: ${{ matrix.mm_commit }}
          SM_COMMIT_EXPECT: ${{ matrix.sm_commit }}
          CSS34_PACK_COMMIT_EXPECT: ${{ github.sha }}
          TIMEOUT_SECS: 120
          SMOKE_CONDEBUG: "1"
          SMOKE_VERBOSE: "1"
        run: |
          set -euo pipefail
          source builder/package-paths.sh
          testing/scripts/smoke-test.sh

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: host-checks-logs-${{ matrix.line }}
          path: |
            .ci-server/smoke.log
            .ci-server/console-probe.log
            .ci-server/cstrike/console.log
            .ci-server/cstrike/addons/metamod/bin/metamod-fatal.log
            .ci-server/addons/metamod/bin/metamod-fatal.log
            .ci-server/metamod-fatal.log
            .ci-server/cstrike/metamod-fatal.log
            .ci-server/cstrike/addons/sourcemod/logs/L*.log
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: gate
    if: always()
    needs:
      - plan
      - check-pins
      - hygiene
      - build-linux
      - build-windows
      - wine-smoke
      - prepare-server
      - smoke
      - botplay
      - host-checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Evaluate Unified Gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
        run: |
          python3 builder/scripts/ci_gate.py \
            --needs-json "${NEEDS_JSON}" \
            --plan-json "${REQUIRED_JOBS}"
